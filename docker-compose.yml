services:
  dcmaker:
    build: .
    image: dcmaker:latest
    # Chromium + ffmpeg peak together during animated-SVG conversion
    mem_limit: 2g
    init: true
    restart: unless-stopped
    ports:
      - "${DCM_PORT:-8000}:8000"
    environment:
      DCM_HOST: 0.0.0.0
      DCM_MAX_UPLOAD_MB: ${DCM_MAX_UPLOAD_MB:-32}
      DCM_CAPTURE_FPS: ${DCM_CAPTURE_FPS:-24}
      DCM_CAPTURE_MAX_SECONDS: ${DCM_CAPTURE_MAX_SECONDS:-15}
      DCM_DEFAULT_DURATION: ${DCM_DEFAULT_DURATION:-3}
    volumes:
      - dcmaker-data:/data

  # Release automation — dormant: the `release` profile keeps it out of
  # `docker compose up`. Run on demand, supplying the token only for that run:
  #   GITHUB_TOKEN=github_pat_xxx \
  #     docker compose --profile release run --rm release v0.2.0
  # (the token never touches the long-running web service above).
  release:
    profiles: ["release"]
    build: .
    image: dcmaker:latest
    mem_limit: 512m
    environment:
      GH_TOKEN: ${GITHUB_TOKEN:-}
      DCM_RELEASE_REPO: ${DCM_RELEASE_REPO:-}
    volumes:
      - .:/repo:ro
    working_dir: /repo
    entrypoint: ["bash", "scripts/release.sh"]

volumes:
  dcmaker-data:
